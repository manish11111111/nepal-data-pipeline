
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: nepal_data
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d nepal_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nepal_data
      DB_USER: pipeline_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - pipeline

volumes:
  postgres_data:
